# macPad · 云端 macOS 构建（GitHub Actions）
#
# 用途：把「必须有一台 Mac」的构建环节搬到 GitHub 的 macOS runner 上，
#       产出 MacWSWindowing 三件套 + 完整 .deb，供 Windows/iPad 侧使用。
#
# 放置位置：macPad 仓库根目录下的  .github/workflows/macpad-build.yml
#
# 触发方式：
#   1) 手动：仓库 -> Actions -> Build macPad -> Run workflow
#   2) 自动：push 改动到 MacWSWindowing/ 或共享头文件时
#
# 注意：本文件未在真实仓库中实测过，首次运行请预留调试时间。

name: Build macPad

on:
  workflow_dispatch:
  push:
    paths:
      - 'MacWSWindowing/**'
      - 'include/**'
      - 'Makefile'
      - 'config/production.mk'
      - 'ci/**'
      - '.github/workflows/macpad-build.yml'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 确认 Xcode 工具链
        run: |
          xcode-select -p
          xcrun --sdk macosx --show-sdk-version
          which dyld_info
          which shasum
          clang --version | head -2
          python3 -V

      - name: 安装构建工具（GNU make / ldid / dpkg / git-lfs）
        run: |
          brew install make ldid dpkg git-lfs
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> "$GITHUB_PATH"

      - name: 安装 Theos 与 iOS SDK
        run: |
          export THEOS="$HOME/theos"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          cd "$RUNNER_TEMP/sdks"
          git lfs install --local || true
          git lfs pull || true

          mkdir -p "$THEOS/sdks"
          cp -R "$RUNNER_TEMP"/sdks/*.sdk "$THEOS/sdks/" 2>/dev/null || true

          echo "--- 安装到的 iPhoneOS SDK ---"
          ls -1 "$THEOS/sdks" | grep -i '^iPhoneOS' || true

          # 上游 macPad 只在 iPhoneOS16.5.sdk 下验证通过。
          # 根 Makefile 是 `TARGET := iphone:clang:latest:14.0`，一旦 theos/sdks
          # 里存在 17.x，`latest` 就会选中它 —— 而 iPhoneOS17.x 自带 xpc/xpc.h，
          # 会让 MTLCompilerBypassOSCheck/Tweak.x:21 的
          #     extern void *xpc_data_create(const void *bytes, size_t length);
          # 与 SDK 的 `xpc_object_t xpc_data_create(...)` 冲突
          # （error: conflicting types），并连带 848 / 893 行报
          # "implicit conversion of 'xpc_object_t' to 'void *' requires a bridged cast"，
          # 使该组件编译失败。
          # 该组件承载 iPadOS 16.5.1 的 UUID / 偏移 / 指令签名适配（见
          # macPad-port/12_Phase2_UUID重算与补丁.md），缺了它 GPU 着色器编译
          # 这一路不成立，因此这里强制钉死 SDK 版本，不允许被 latest 漂移。
          if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            echo "ERROR: 缺少上游验证版本 iPhoneOS16.5.sdk" >&2
            exit 1
          fi
          for d in "$THEOS"/sdks/iPhoneOS*.sdk; do
            [ -d "$d" ] || continue
            [ "$(basename "$d")" = "iPhoneOS16.5.sdk" ] && continue
            echo "移除 $(basename "$d")（只保留上游验证过的 iPhoneOS16.5.sdk）"
            rm -rf "$d"
          done

          echo "--- 最终 Theos SDKs ---"
          ls "$THEOS/sdks"

      - name: 构建
        run: bash ci/macpad_ci_build.sh

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macpad-dist
          path: |
            dist/
            MacWSWindowing/.theos/obj/MacWSWindowing.dylib
          if-no-files-found: warn
          retention-days: 30
